<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>babuuu. SOY2026 投票バナー 1600×311</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@page{size:1600px 311px;margin:0}
:root{--ink:#181613;--ink-2:#6b6660;--paper:#f6f4f0;--yellow:#FFC300;--yellow-l:#fff3c4;--blue:#1E9FD6;--blue-l:#dff1fa;--pink:#FF4C86;--pink-l:#ffe3ec}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:311px;overflow:hidden;background:var(--paper)}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bn{position:relative;width:1600px;height:311px;overflow:hidden;display:grid;grid-template-columns:262px 1fr 716px;align-items:center;padding:0 44px 0 34px;background:var(--paper)}
.blob{position:absolute;border-radius:50%}
.l{position:relative;z-index:1}
.l .logo{width:140px;display:block}
/* 応援メッセージカード＋スタンプ（ページのアニメと同じモチーフ） */
.card{position:relative;width:214px;height:126px;margin-top:14px;background:#fff;border-radius:12px;box-shadow:0 10px 22px rgba(24,22,19,.1),0 0 0 1.5px var(--ink)}
.card .top{height:30px;padding:0 14px;display:flex;align-items:center;border-bottom:1.5px dashed rgba(24,22,19,.12);font-family:"Jost",sans-serif;font-weight:500;font-size:11px;letter-spacing:.16em}
.card .top i{font-style:normal;color:var(--blue);margin-left:6px}
.card .to{position:absolute;left:16px;top:36px;font-size:10px;color:var(--ink-2)}
.card .msg{position:absolute;left:16px;top:52px;font-size:16px;font-weight:700;color:var(--blue);white-space:nowrap}
.card .ln{position:absolute;left:14px;right:14px;height:0;border-bottom:1.5px dashed rgba(24,22,19,.18)}
.stamp{position:absolute;left:146px;top:-14px;width:96px;height:96px;border-radius:50%;border:4px solid var(--pink);color:var(--pink);display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.75)}
.stamp::before{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px solid var(--pink)}
.stamp i{font-style:normal;font-size:14px;line-height:1}
.stamp b{font-family:"Jost",sans-serif;font-weight:600;font-size:16px;line-height:1;letter-spacing:.08em;text-align:center}
.stamp small{font-family:"Jost",sans-serif;font-weight:500;font-size:9px;letter-spacing:.14em}
.c{position:relative;z-index:1;text-align:left;padding-left:6px}
.c .soy{font-family:"Jost",sans-serif;font-weight:400;font-size:24px;letter-spacing:.14em;white-space:nowrap}
.c .soy b{font-weight:500;font-size:1.35em;letter-spacing:.04em;margin-left:.3em;background:linear-gradient(transparent 62%,var(--yellow) 62%,var(--yellow) 92%,transparent 92%);padding:0 .1em}
.c .ttl{font-weight:900;font-size:100px;line-height:1.1;letter-spacing:0;white-space:nowrap;margin-top:6px}
.r{position:relative;z-index:1}
.pt{background:#fff;border:1.5px solid var(--ink);border-radius:18px;padding:16px 24px 22px;text-align:center;line-height:1.35;white-space:nowrap}
.pt .a{font-weight:900;font-size:44px}
.pt .a b{font-family:"Jost",sans-serif;font-weight:600;font-size:1.5em;color:var(--blue)}
.pt .a small{font-size:.75em}
.pt .b{font-weight:700;font-size:34px;margin-top:4px;color:var(--pink)}
.pt .b b{font-family:"Jost",sans-serif;font-weight:600;font-size:1.25em}
.meta{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:-6px;padding-left:4px;white-space:nowrap}
.dl{font-weight:700;font-size:30px;margin-top:14px}
.dl b{font-family:"Jost",sans-serif;font-weight:600;font-size:1.4em;background:linear-gradient(transparent 60%,var(--yellow) 60%);padding:0 .1em}
.cta{display:inline-flex;align-items:center;gap:10px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:31px;letter-spacing:.08em;padding:13px 16px 13px 36px;box-shadow:0 5px 0 rgba(0,0,0,.2);position:relative;z-index:2}
.cta i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--yellow);color:var(--ink);font-style:normal;font-size:15px}
</style>
</head>
<body>
<div class="bn">
  <span class="blob" style="width:260px;height:260px;left:-80px;top:-120px;background:var(--yellow-l)"></span>
  <span class="blob" style="width:220px;height:220px;left:820px;top:180px;background:var(--blue-l)"></span>
  <span class="blob" style="width:200px;height:200px;left:1450px;top:-110px;background:var(--pink-l)"></span>

  <div class="l">
    <img class="logo" src="../images/logo.png" alt="babuuu.">
    <div class="card">
      <div class="top">MESSAGE<i>SOY 2026</i></div>
      <p class="to">応援メッセージ</p>
      <span class="ln" style="top:78px"></span><span class="ln" style="top:112px"></span>
      <p class="msg">応援してます！</p>
      <div class="stamp"><i>♥</i><b>THANK<br>YOU</b><small>babuuu.</small></div>
    </div>
  </div>

  <div class="c">
    <p class="soy">RAKUTEN SHOP OF THE YEAR<b>2026</b></p>
    <p class="ttl">投票受付中</p>
  </div>

  <div class="r">
    <div class="pt">
      <p class="a">最大<b>10,000</b><small>ポイント</small>！</p>
      <p class="b">合計<b>10</b>万名様に当たる！</p>
    </div>
    <div class="meta"><p class="dl">投票は<b>11.30</b>(月)09:59まで</p><span class="cta">投票はこちら<i>▶</i></span></div>
  </div>
</div>
</body>
</html>
