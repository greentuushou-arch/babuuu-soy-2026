<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>babuuu. THANK YOU スタンプ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Jost:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#FF4C86}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:800px;height:800px;background:transparent;overflow:hidden}
body{display:grid;place-items:center;font-family:"Noto Sans JP",sans-serif;-webkit-print-color-adjust:exact}
.stamp{position:relative;width:96px;height:96px;zoom:8;border-radius:50%;border:4px solid var(--pink);color:var(--pink);display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}
.stamp::before{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px solid var(--pink)}
.stamp i{font-style:normal;font-size:14px;line-height:1}
.stamp b{font-family:"Jost",sans-serif;font-weight:600;font-size:16px;line-height:1;letter-spacing:.08em;text-align:center}
.stamp small{font-family:"Jost",sans-serif;font-weight:500;font-size:9px;letter-spacing:.14em}
</style>
</head>
<body>
<div class="stamp"><i>♥</i><b>THANK<br>YOU</b><small>babuuu.</small></div>
</body>
</html>
